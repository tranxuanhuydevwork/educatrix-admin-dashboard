<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Purple Admin</title>
    <link rel="stylesheet" th:src="@{/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/css/vendor.bundle.base.css}">
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="images/favicon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .dashboard-card {
            color: white;
            padding: 20px;
            border-radius: 4px; /* Góc cạnh hơn */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.2);
        }
        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .bg-custom-orange { background-color: #f4a742; }
        .bg-custom-green  { background-color: #4bc76d; }
        .bg-custom-red    { background-color: #f24c4c; }
        .bg-custom-blue   { background-color: #1666d9; }
        .card {
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            padding: 20px;
        }
    </style>
    <script>
        var labelStudentPerCourse = null;

        const socket = new SockJS("/ws");
        const stompClient = Stomp.over(socket);
        $(document).ready(function(){
            stompClient.connect({}, function (frame) {
                stompClient.subscribe("/topic/dashboard", function (message) {
                    var receive = JSON.parse(message.body);
                    labelStudentPerCourse = receive.listCategory;


                    console.log(labelStudentPerCourse);

                    updateCountRateChart(receive.getNumbersRateOfUsers);
                });

                stompClient.send("/app/admin/statistics/dashboard", {}, {});
            });
        });

        function updateCountRateChart(data) {
            let labels = Object.keys(data).map(Number).sort((a, b) => a - b);

            let values = Object.values(data);
            if (window.ratingChart instanceof Chart) {
                window.ratingChart.destroy();
            }

            let ctx = document.getElementById("ratingChart").getContext("2d");
            window.ratingChart = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Number of Reviews",
                        data: values,
                        backgroundColor: "#3498db"
                    }]
                },
                options: { responsive: true }
            });
        }

    </script>
</head>
<body>
<div class="container-scroller">

    <div th:replace="~{/view/admin/partials/_navbar :: _navbar}"></div>
    <!-- partial -->
    <div class="container-fluid page-body-wrapper">
        <!-- partial:partials/_sidebar.html -->
        <div th:replace="~{/view/admin/partials/_sidebar :: _sidebar}"></div>
        <!-- partial -->
        <div class="main-panel">
            <div class="content-wrapper">
                <div class="container mt-4">


                    <div class="container mt-4">
                        <h3 class="text-center">📊 Course & Feedback Statistics</h3>
                        <div class="row">
                            <div class="col-lg-4 col-md-6">
                                <div class="card">
                                    <h5 class="text-center">⏳ Completion Rate</h5>
                                    <canvas id="completionChart" style="max-height: 250px;"></canvas>
                                </div>
                            </div>
                            <div class="col-lg-4 col-md-6">
                                <div class="card">
                                    <h5 class="text-center">⭐ Course Ratings</h5>
                                    <canvas id="ratingChart" style="max-height: 250px;"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            <div th:replace="~{/view/admin/partials/_footer :: _footer}"></div>
            <!-- partial -->
        </div>
        <!-- main-panel ends -->
    </div>
    <!-- page-body-wrapper ends -->
</div>

<!-- container-scroller -->

<!-- plugins:js -->
<script th:src="@{/js/vendor.bundle.base.js}"></script>
<script th:src="@{/js/vendor.bundle.addons.js}"></script>
<!--&lt;!&ndash; endinject &ndash;&gt;-->
<!--&lt;!&ndash; Plugin js for this page&ndash;&gt;-->
<!--&lt;!&ndash; End plugin js for this page&ndash;&gt;-->
<!--&lt;!&ndash; inject:js &ndash;&gt;-->
<script th:src="@{/js/off-canvas.js}"></script>
<script th:src="@{/js/misc.js}"></script>
<!--&lt;!&ndash; endinject &ndash;&gt;-->
<!--&lt;!&ndash; Custom js for this page&ndash;&gt;-->
<script th:src="@{/js/dashboard.js}"></script>
<!-- End custom js for this page-->
</body>

</html>

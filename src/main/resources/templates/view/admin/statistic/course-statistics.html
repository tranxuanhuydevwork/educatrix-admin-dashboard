<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Course Analytics</title>

    <link rel="stylesheet" th:src="@{/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/css/vendor.bundle.base.css}">
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="images/favicon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-card {
            color: white;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.2);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .bg-custom-orange { background-color: #f4a742; }
        .bg-custom-green  { background-color: #4bc76d; }
        .bg-custom-red    { background-color: #f24c4c; }
        .bg-custom-blue   { background-color: #1666d9; }

        .card {
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            padding: 20px;
        }
    </style>

    <script>
        $(document).ready(function(){
            const socket = new SockJS("/ws");
            const stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                console.log("Connected: " + frame);

                stompClient.subscribe("/topic/course-statistics", function (message) {
                    const data = JSON.parse(message.body);
                    updateCharts(data);
                });

                stompClient.send("/app/admin/statistics/course", {}, {});
            });

            function updateCharts(data) {
                updateChart(studentsPerCourseChart, data.studentsPerCourse);
                updateChart(completionChart, data.completionRate);
                updateChart(courseRatingsChart, data.courseRatings);
                updateChart(feedbackSentimentChart, data.feedbackSentiment);
            }

            function updateChart(chart, newData) {
                chart.data.datasets[0].data = newData;
                chart.update();
            }
        });
    </script>
</head>

<body>
<div class="container-scroller">

    <div th:replace="~{/view/admin/partials/_navbar :: _navbar}"></div>
    <!-- partial -->
    <div class="container-fluid page-body-wrapper">
        <!-- partial:partials/_sidebar.html -->
        <div th:replace="~{/view/admin/partials/_sidebar :: _sidebar}"></div>
        <!-- partial -->
        <div class="main-panel">
            <div class="content-wrapper">
<div class="container mt-4">
    <h2 class="text-center">📊 Course Statistics</h2>
    <div class="row">
        <div class="col-lg-4">
            <div class="card p-3">
                <h5 class="text-center">👨‍🎓 Students Per Course</h5>
                <canvas id="studentChart"></canvas>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card p-3">
                <h5 class="text-center">⏳ Completion Rate</h5>
                <canvas id="completionChart"></canvas>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card p-3">
                <h5 class="text-center">⭐ Course Ratings</h5>
                <canvas id="ratingChart"></canvas>
            </div>
        </div>
    </div>
    <div class="mt-4">
        <h4 class="text-center">📌 Top Courses</h4>
        <table id="courseTable" class="table table-striped">
            <thead>
            <tr>
                <th>#</th>
                <th>Course Name</th>
                <th>Students</th>
                <th>Completion Rate</th>
                <th>Rating</th>
            </tr>
            </thead>
            <tbody>
            <tr><td>1</td><td>Java Spring Boot</td><td>150</td><td>85%</td><td>4.8</td></tr>
            <tr><td>2</td><td>Python for Data</td><td>120</td><td>75%</td><td>4.6</td></tr>
            <tr><td>3</td><td>Frontend ReactJS</td><td>100</td><td>80%</td><td>4.7</td></tr>
            <tr><td>4</td><td>SQL Database</td><td>95</td><td>65%</td><td>4.5</td></tr>
            <tr><td>5</td><td>AI & Machine Learning</td><td>80</td><td>70%</td><td>4.9</td></tr>
            </tbody>
        </table>
    </div>
</div>
            </div>
            <div th:replace="~{/view/admin/partials/_footer :: _footer}"></div>

        </div>

    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        new simpleDatatables.DataTable("#courseTable");

        const studentChart = new Chart(document.getElementById("studentChart"), {
            type: 'bar',
            data: {
                labels: ["Java", "Python", "React", "SQL", "AI"],
                datasets: [{
                    label: "Students",
                    data: [150, 120, 100, 95, 80],
                    backgroundColor: "#4bc76d"
                }]
            }
        });

        const completionChart = new Chart(document.getElementById("completionChart"), {
            type: 'doughnut',
            data: {
                labels: ["Java", "Python", "React", "SQL", "AI"],
                datasets: [{
                    data: [85, 75, 80, 65, 70],
                    backgroundColor: ["#f4a742", "#4bc76d", "#f24c4c", "#1666d9", "#8e44ad"]
                }]
            }
        });

        const ratingChart = new Chart(document.getElementById("ratingChart"), {
            type: 'line',
            data: {
                labels: ["Java", "Python", "React", "SQL", "AI"],
                datasets: [{
                    label: "Rating",
                    data: [4.8, 4.6, 4.7, 4.5, 4.9],
                    borderColor: "#1666d9",
                    fill: false
                }]
            }
        });
    });
</script>
<script th:src="@{/js/vendor.bundle.base.js}"></script>
<script th:src="@{/js/vendor.bundle.addons.js}"></script>
<script th:src="@{/js/off-canvas.js}"></script>
<script th:src="@{/js/misc.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>

</body>

</html>

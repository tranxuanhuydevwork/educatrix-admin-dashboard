<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Educatrix Admin</title>
  <link rel="stylesheet" th:src="@{/css/materialdesignicons.min.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" th:src="@{/css/vendor.bundle.base.css}">
  <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
  <link th:href="@{/css/style.css}" rel="stylesheet" />
  <link th:href="@{/css/style111.css}" rel="stylesheet" />
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="/images/favicon.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script> <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .notification-badge {
      position: absolute;
      top: 3px;
      right: -2px;
      background-color: #ff4747;
      color: #ffffff;
      font-size: 10px;
      border-radius: 50%;
      padding: 2px 4px;
      min-width: 18px;
      text-align: center;
    }

    .list-group-item.unread {
      background-color: rgba(0, 123, 255, 0.05);
      font-weight: 500;
      position: relative;
    }

    .list-group-item.unread:after {
      content: '';
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #007bff;
    }

    .notification-dropdown {
      min-width: 320px;
      max-width: 320px;
      padding: 0;
    }

    .notification-dropdown .dropdown-header {
      font-size: 14px;
      padding: 15px;
      font-weight: 500;
    }

    .notification-dropdown .dropdown-item {
      padding: 10px 15px;
      border-bottom: 1px solid #f5f5f5;
    }

    .notification-dropdown .dropdown-item:last-child {
      border-bottom: none;
    }

    .notification-dropdown .preview-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #f8f9fa;
    }

    .notification-dropdown .preview-icon i {
      font-size: 18px;
    }

    .notification-preview {
      max-height: 350px;
      overflow-y: auto;
    }

    .toast {
      z-index: 1060;
    }

    @media (max-width: 576px) {
      .notification-dropdown {
        min-width: 280px;
        max-width: 280px;
      }
    }
  </style>
  <script>
    let stompClient = null;
    let currentFilter = 'all';

    function connect() {
      const socket = new SockJS('/ws');
      stompClient = Stomp.over(socket);
      stompClient.connect({}, function(frame) {
        console.log('Connected: ' + frame);

        stompClient.subscribe('/topic/admin/notifications', function(notification) {
          const data = JSON.parse(notification.body);
          handleNotificationUpdate(data);
        });

        loadNotifications();
      });
    }

    function disconnect() {
      if (stompClient !== null) {
        stompClient.disconnect();
      }
      console.log("Disconnected");
    }

    function loadNotifications() {
      let url = '/api/admin/notifications/all';

      if (currentFilter === 'unread') {
        url = '/api/admin/notifications/by-status/UNREAD';
      } else if (currentFilter === 'read') {
        url = '/api/admin/notifications/by-status/READ';
      }

      fetch(url)
              .then(response => response.json())
              .then(data => {
                displayNotifications(data);
              })
              .catch(error => console.error('Error loading notifications:', error));
    }

    function displayNotifications(notifications) {
      const notificationList = document.getElementById('notificationList');
      notificationList.innerHTML = '';

      if (notifications.length === 0) {
        notificationList.innerHTML = '<div class="text-center p-3">No notifications found</div>';
        return;
      }

      notifications.forEach(notification => {
        const isUnread = notification.status === 'UNREAD';
        const date = new Date(notification.createdAt);
        const timeAgo = getTimeAgo(date);

        const notificationItem = document.createElement('div');
        notificationItem.className = `list-group-item list-group-item-action d-flex align-items-center ${isUnread ? 'unread' : ''}`;
        notificationItem.dataset.id = notification.id;

        notificationItem.innerHTML = `
            <i class="${notification.iconClass || 'fa-solid fa-bell'} me-3"></i>
            <div class="w-100">
                <div class="d-flex justify-content-between">
                    <h6 class="mb-1">${notification.type || 'Notification'}</h6>
                    <small>${timeAgo}</small>
                </div>
                <p class="mb-1 text-muted">${notification.message}</p>
                <small class="text-muted">User: ${notification.username || 'Unknown'}</small>
            </div>
            <div class="ms-2 btn-group">
                <button class="btn btn-sm btn-outline-primary mark-read-btn" ${isUnread ? '' : 'disabled'}>
                    <i class="fa-solid fa-check"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger delete-btn">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        `;

        notificationList.appendChild(notificationItem);

        notificationItem.querySelector('.mark-read-btn').addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          markAsRead(notification.id);
        });

        notificationItem.querySelector('.delete-btn').addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          deleteNotification(notification.id);
        });
      });
    }

    function markAsRead(id) {
      fetch(`/api/admin/notifications/mark-read/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        }
      })
              .then(response => response.json())
              .then(data => {
                console.log('Notification marked as read:', data);
              })
              .catch(error => console.error('Error marking notification as read:', error));
    }

    function markAllAsRead() {
      fetch('/api/admin/notifications/mark-all-read', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        }
      })
              .then(response => response.json())
              .then(data => {
                console.log('All notifications marked as read:', data);
              })
              .catch(error => console.error('Error marking all notifications as read:', error));
    }

    function deleteNotification(id) {
      if (confirm('Are you sure you want to delete this notification?')) {
        fetch(`/api/admin/notifications/delete/${id}`, {
          method: 'DELETE'
        })
                .then(response => response.json())
                .then(data => {
                  console.log('Notification deleted:', data);
                })
                .catch(error => console.error('Error deleting notification:', error));
      }
    }

    function handleNotificationUpdate(data) {
      if (data.action === 'read-all') {
        loadNotifications();
      } else if (data.action === 'delete') {
        const notificationElement = document.querySelector(`.list-group-item[data-id="${data.id}"]`);
        console.log(notificationElement);
        if (notificationElement) {
          notificationElement.remove();
        }
      } else {
        loadNotifications();
      }
    }

    function getTimeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);

      let interval = Math.floor(seconds / 31536000);
      if (interval > 1) return interval + ' years ago';
      if (interval === 1) return '1 year ago';

      interval = Math.floor(seconds / 2592000);
      if (interval > 1) return interval + ' months ago';
      if (interval === 1) return '1 month ago';

      interval = Math.floor(seconds / 86400);
      if (interval > 1) return interval + ' days ago';
      if (interval === 1) return '1 day ago';

      interval = Math.floor(seconds / 3600);
      if (interval > 1) return interval + ' hours ago';
      if (interval === 1) return '1 hour ago';

      interval = Math.floor(seconds / 60);
      if (interval > 1) return interval + ' minutes ago';
      if (interval === 1) return '1 minute ago';

      return 'just now';
    }

    function toggleReceiverField() {
      const iconClassSelect = document.getElementById('iconClass');
      const receiverField = document.getElementById('receiverField');
      const systemNoticeText = document.getElementById('systemNoticeText');
      const receiverInput = document.getElementById('receiverUserName');

      if (iconClassSelect.value === 'SYSTEM') {
        receiverField.style.display = 'none';
        receiverInput.required = false;
        receiverInput.value = '';  // Clear the value
        systemNoticeText.style.display = 'block';
      } else {
        receiverField.style.display = 'block';
        receiverInput.required = true;
        systemNoticeText.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      connect();

      document.getElementById('markAllRead').addEventListener('click', function() {
        markAllAsRead();
      });

      document.getElementById('filter').addEventListener('change', function() {
        currentFilter = this.value;
        loadNotifications();
      });

      document.getElementById('createNotification').addEventListener('click', function() {
        $('#createNotificationModal').modal('show');
      });

      $('#createNotificationModal').on('shown.bs.modal', function() {
        toggleReceiverField();
        document.getElementById('notificationForm').reset();
      });
      document.getElementById('notificationForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const notificationType = document.getElementById('notificationType').value;
        const message = document.getElementById('message').value;
        const iconClass = document.getElementById('iconClass').value;

        let formData = {
          type: notificationType,
          message: message,
          iconClass: iconClass
        };

        if (iconClass === 'SYSTEM') {
          formData.userId = 'ALL_USERS';
        } else {
          const receiverUserName = document.getElementById('receiverUserName').value;
          if (!receiverUserName) {
            alert('Please specify a receiver for the message notification.');
            return;
          }
          formData.userId = receiverUserName;
        }

        const referenceId = document.getElementById('referenceId')?.value;
        if (referenceId) {
          formData.referenceId = referenceId;
        }

        // This is the fixed part - removing the incomplete condition
        // if(formData.userId === 'ALL_USERS'){a
        // }

        fetch('/api/admin/notifications/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        })
                .then(response => {
                  if (!response.ok) {
                    throw new Error('Network response was not ok');
                  }
                  return response.json();
                })
                .then(data => {
                  $('#createNotificationModal').modal('hide');
                  document.getElementById('notificationForm').reset();

                  const toast = document.createElement('div');
                  toast.className = 'toast position-fixed top-0 end-0 m-3';
                  toast.setAttribute('role', 'alert');
                  toast.setAttribute('aria-live', 'assertive');
                  toast.setAttribute('aria-atomic', 'true');
                  toast.setAttribute('data-bs-delay', '3000');
                  toast.innerHTML = `
      <div class="toast-header">
        <strong class="me-auto">Success</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body">
        Notification created successfully!
      </div>
    `;
                  document.body.appendChild(toast);

                  const bsToast = new bootstrap.Toast(toast);
                  bsToast.show();

                  loadNotifications();
                })
                .catch(error => {
                  console.error('Error creating notification:', error);

                  const toast = document.createElement('div');
                  toast.className = 'toast position-fixed top-0 end-0 m-3';
                  toast.setAttribute('role', 'alert');
                  toast.setAttribute('aria-live', 'assertive');
                  toast.setAttribute('aria-atomic', 'true');
                  toast.setAttribute('data-bs-delay', '3000');
                  toast.innerHTML = `
      <div class="toast-header">
        <strong class="me-auto">Error</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body">
        Failed to create notification. Please try again.
      </div>
    `;
                  document.body.appendChild(toast);

                  const bsToast = new bootstrap.Toast(toast);
                  bsToast.show();
                });
      });
    });

    window.addEventListener('beforeunload', function() {
      disconnect();
    });
  </script>
</head>

<body>

<div class="container-scroller">

  <div th:replace="~{/view/admin/partials/_navbar :: _navbar}"></div>
  <div class="container-fluid page-body-wrapper">
    <div th:replace="~{/view/admin/partials/_sidebar :: _sidebar}"></div>
    <div class="main-panel">
      <div class="content-wrapper">
        <div class="container-fluid">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>
              <i class="fa-solid fa-bell me-2"></i>
              Notifications Management
            </h3>
            <button class="btn btn-primary" id="createNotification">
              <i class="fa-solid fa-plus me-1"></i>
              Create Notification
            </button>
          </div>

          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                  <button class="btn btn-primary" id="markAllRead">
                    <i class="fa-solid fa-check-double me-1"></i>
                    Mark all as read
                  </button>
                </div>
                <div class="d-flex align-items-center">
                  <label class="me-2">Filter:</label>
                  <select class="form-select" id="filter">
                    <option value="all">All</option>
                    <option value="unread">Unread</option>
                    <option value="read">Read</option>
                  </select>
                </div>
              </div>

              <div class="list-group" id="notificationList">
                <div class="text-center p-5">
                  <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                  <p class="mt-2">Loading notifications...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</div>
</div>
<div class="modal fade" id="createNotificationModal" tabindex="-1" aria-labelledby="createNotificationModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="createNotificationModalLabel">Create New Notification</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="notificationForm">
          <div class="mb-3">
            <label for="notificationType" class="form-label">Title</label>
            <input type="text" class="form-control" id="notificationType" required>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label for="iconClass" class="form-label">Notification Type</label>
            <select id="iconClass" class="form-select" onchange="toggleReceiverField()">
              <option value="SYSTEM"><i class="fas fa-cogs"></i> System</option>
              <option value="MESSAGE"><i class="fas fa-envelope"></i> Message</option>
            </select>
            <small id="systemNoticeText" class="form-text text-muted" style="display: none; color: #0d6efd;">
              <i class="fas fa-info-circle me-1"></i> This notification will be sent to all system users.
            </small>
          </div>
          <div class="mb-3" id="receiverField">
            <label for="receiverUserName" class="form-label">Receiver</label>
            <input type="text" class="form-control" id="receiverUserName">
          </div>
          <div class="mb-3" style="display: none;">
            <input type="hidden" id="userId" value="">
            <input type="hidden" id="referenceId" value="">
          </div>
          <button type="submit" class="btn btn-primary">Create</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/admin-notifications.js"></script>
</body>
</html>
